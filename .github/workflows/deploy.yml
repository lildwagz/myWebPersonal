name: Build and publish site image

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mywebpersonal

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image names; the repo owner may contain capitals.
      - name: Normalise image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      # Only the final stage is per-architecture, and it is a plain COPY,
      # so no QEMU emulation is needed for arm64 (e.g. Raspberry Pi).
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  purge-cache:
    needs: image
    runs-on: ubuntu-latest
    # Optional: set CLOUDFLARE_ZONE_ID and CLOUDFLARE_API_TOKEN (Zone > Cache Purge)
    # as repository secrets. Waits for the server's 5-minute pull timer first.
    env:
      ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Purge Cloudflare cache
        if: env.ZONE != '' && env.TOKEN != ''
        run: |
          sleep 360
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE}/purge_cache" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
